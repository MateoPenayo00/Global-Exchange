<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Exchange Pro{% endblock %}</title>
    <style>
      :root { --navy: #0b1f3a; --teal: #1f9d8f; --bg: #f6f8fb; --card: #ffffff; --text: #1f2937; }
      body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
      header { background: var(--navy); color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
      a { color: var(--teal); text-decoration: none; }
      .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
      .card { background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
      .btn { display: inline-block; padding: 10px 16px; border-radius: 8px; margin-right: 8px; border: 0; cursor: pointer; }
      .btn-primary { background: var(--teal); color: white; }
      .btn-secondary { background: #e5e7eb; color: #111827; }
      .danger { color: #b91c1c; }
      footer { padding: 24px; text-align: center; color: #6b7280; }
    </style>
  </head>
  <body>
    <header>
      <div><strong>Exchange Pro</strong> — Global Currency Services</div>
      <nav>
        <a href="/">Home</a> |
        {% if user.is_authenticated %}
          <a href="/dashboard/">Dashboard</a> |
          <a href="/account/">Account</a> |
          <a href="/logout/">Logout</a>
        {% else %}
          <a href="/login/">Login</a> |
          <a href="/register/">Register</a>
        {% endif %}
      </nav>
    </header>
    <div class="container">
      {% block content %}{% endblock %}
    </div>
    <footer>Exchange Pro — secure currency exchange learning project</footer>
  </body>
</html>
