{% comment %}
Logotipo de Exchange Pro: un cohete morado con la estela en rosa pastel.
Se incluye como fragmento para que el mismo dibujo sirva en la barra lateral,
en la página pública y en cualquier otro lugar, sin duplicarlo.
{% endcomment %}
