{% extends 'core/base.html' %}
{% block title %}Exchange Pro | Eliminar divisa{% endblock %}
{% block content %}
  <div class="card stack">
    <div>
      <h1>Eliminar divisa</h1>
      <p>¿Seguro que quieres eliminar <strong>{{ currency.code }} — {{ currency.name }}</strong>? Esta acción no se puede deshacer.</p>
    </div>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Sí, eliminar</button>
      <a class="btn btn-secondary" href="{% url 'currency_management' %}">Cancelar</a>
    </form>
  </div>
{% endblock %}
