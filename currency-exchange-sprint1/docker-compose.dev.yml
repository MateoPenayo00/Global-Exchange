# Ambiente de DESARROLLO (se combina con docker-compose.yml):
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   o simplemente:  ./scripts/deploy.sh dev
#
# El código de backend/ se monta dentro del contenedor y gunicorn se recarga solo
# al guardar un archivo: no hace falta reconstruir la imagen por cada cambio.
services:
  web:
    environment:
      DJANGO_DEBUG: "1"
      # Los estáticos van fuera de /app para no crear backend/staticfiles en el disco.
      DJANGO_STATIC_ROOT: /srv/staticfiles
    volumes: !override
      - ./backend:/app
      - static_files:/srv/staticfiles
    command: >-
      sh -c "python manage.py migrate --noinput
      && python manage.py collectstatic --noinput
      && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --reload"
